name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      ANONYMIZED_TELEMETRY: 'false'
      BROWSER_USE_CLOUD_SYNC: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check src tests examples scripts skills
      - run: uv run ruff format --check src tests examples scripts skills
      - run: uv run pytest -q
      - run: uv build
