[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "browser-use-with-jev"
version = "0.1.0"
description = "Browser Use with Jev decisions and full host-model handoff"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["browser-use==0.13.10", "httpx>=0.28.1,<0.29", "jsonschema>=4.26,<5"]

[project.urls]
Repository = "https://github.com/ZiyaoLi/browser-use-with-jev"
Issues = "https://github.com/ZiyaoLi/browser-use-with-jev/issues"

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/browser_use_with_jev"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/scripts", "/skills", "/.github", "/README.md", "/LICENSE", "/.env.example", "/pyproject.toml", "/uv.lock"]
exclude = ["/.archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
